name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plexaddons-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -c "
          import ast, pathlib, sys
          errors = []
          for p in pathlib.Path('app').rglob('*.py'):
              try:
                  ast.parse(p.read_text())
              except SyntaxError as e:
                  errors.append(f'{p}: {e}')
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print(f'All {len(list(pathlib.Path(\"app\").rglob(\"*.py\")))} files OK')
          "

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plexaddons-api
    env:
      SECRET_KEY: test-secret-key-ci
      DATABASE_URL: sqlite+aiosqlite:///test.db
      REDIS_URL: redis://localhost:6379/15
      DISCORD_CLIENT_ID: test
      DISCORD_CLIENT_SECRET: test
      DISCORD_REDIRECT_URI: http://localhost/callback
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_test
      STRIPE_PRO_PRICE_ID: price_pro
      STRIPE_PREMIUM_PRICE_ID: price_premium
      PAYPAL_CLIENT_ID: test
      PAYPAL_CLIENT_SECRET: test
      PAYPAL_WEBHOOK_ID: test
      PAYPAL_PRO_PLAN_ID: P-test
      PAYPAL_PREMIUM_PLAN_ID: P-test
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v --tb=short

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plexaddons-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plexaddons-web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plexaddons-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plexaddons-web/package-lock.json
      - run: npm ci
      - run: npm test

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t plexaddons-api:ci plexaddons-api/
      - name: Build Web image
        run: docker build -t plexaddons-web:ci plexaddons-web/
